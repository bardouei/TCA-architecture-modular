name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

jobs:
  packages:
    name: Package tests
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package:
          - Packages/BaseCore
          - Packages/DomainCore
          - Packages/NetworkCore
          - Packages/StorageCore
          - Packages/DesignSystem
          - Packages/AppDependencies
          - Packages/AppFeature
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app
      - name: Test ${{ matrix.package }}
        run: swift test --package-path "${{ matrix.package }}"

  applications:
    name: Application build and tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project TCAtest.xcodeproj -scheme TCAtest
      - name: Build and test main application
        run: >-
          xcodebuild test
          -project TCAtest.xcodeproj
          -scheme TCAtest
          -destination 'platform=iOS Simulator,name=iPhone 17'
          -only-testing:TCAtestTests
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          CODE_SIGNING_ALLOWED=NO
      - name: Build App Clip
        run: >-
          xcodebuild build-for-testing
          -project TCAtest.xcodeproj
          -scheme MyAppClip
          -destination 'platform=iOS Simulator,name=iPhone 17'
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          CODE_SIGNING_ALLOWED=NO
      - name: Test App Clip unit target
        run: >-
          xcodebuild test
          -project TCAtest.xcodeproj
          -target MyAppClipTests
          -destination 'platform=iOS Simulator,name=iPhone 17'
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          CODE_SIGNING_ALLOWED=NO
      - name: Static analysis
        run: >-
          xcodebuild analyze
          -project TCAtest.xcodeproj
          -scheme TCAtest
          -destination 'generic/platform=iOS Simulator'
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          CODE_SIGNING_ALLOWED=NO

  sanitizers:
    name: Scheduled sanitizer tests
    if: github.event_name == 'schedule'
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        sanitizer:
          - address
          - thread
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project TCAtest.xcodeproj -scheme TCAtest
      - name: Run sanitizer
        shell: bash
        run: |
          if [[ "${{ matrix.sanitizer }}" == "address" ]]; then
            SANITIZER_FLAGS="ENABLE_ADDRESS_SANITIZER=YES"
          else
            SANITIZER_FLAGS="ENABLE_THREAD_SANITIZER=YES"
          fi
          xcodebuild test \
            -project TCAtest.xcodeproj \
            -scheme TCAtest \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -only-testing:TCAtestTests \
            $SANITIZER_FLAGS \
            CODE_SIGNING_ALLOWED=NO
